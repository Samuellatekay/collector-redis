# /etc/logstash/conf.d/collector.conf  (VM-2)

input {
  # Data dari OpenCTI & GLPI (dikirim collector ke Redis)
  redis {
    host => "192.168.1.10"
    port => 6379
    password => "GantiPasswordKuat"
    db => 2
    data_type => "list"
    key => "opencti-events"
    codec => "json"
    tags => ["opencti"]
  }
  redis {
    host => "192.168.1.10"
    port => 6379
    password => "GantiPasswordKuat"
    db => 2
    data_type => "list"
    key => "glpi-logs"
    codec => "json"
    tags => ["glpi"]
  }
  redis {
    host => "192.168.1.10"
    port => 6379
    password => "GantiPasswordKuat"
    db => 2
    data_type => "list"
    key => "enrichment-events"
    codec => "json"
    tags => ["enrichment"]
  }
  # Input untuk alert dari Logstash (misalnya dari Wazuh)
  redis {
    host => "192.168.1.10"
    port => 6379
    password => "GantiPasswordKuat"
    db => 2
    data_type => "list"
    key => "logstash_alerts" # Key Redis yang akan diambil
    codec => "json"
    tags => ["logstash_alerts"]
  }
}

filter {
  # ID unik untuk upsert (tiket yang berubah menimpa dokumen lama)
  fingerprint {
    source => ["source_system", "id"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][doc_id]"
  }

  # Proses alert dari logstash_alerts
  if "logstash_alerts" in [tags] {
    # Parsing JSON dari pesan alert
    json {
      source => "message"
      target => "wazuh_alert"
      remove_field => ["message"]
    }

    # Pastikan srcip ada, ambil dari data.srcip atau full_log
    if ![wazuh_alert][data][srcip] {
      grok {
        match => { "[wazuh_alert][full_log]" => "^%{IPORHOST:extracted_srcip} - " }
        add_field => { "[wazuh_alert][data][srcip]" => "%{extracted_srcip}" }
        remove_field => ["extracted_srcip"]
      }
    }

    if [wazuh_alert][rule][id] {
      # IP alert membuat indikator OpenCTI dan tiket GLPI.
      if [wazuh_alert][data][srcip] {
        clone { clones => ["to_opencti"] }
        clone { clones => ["to_glpi"] }
      }
      # Hash file dikirim ke OpenCTI sebagai indikator StixFile, bukan dicari di GLPI.
      if [wazuh_alert][syscheck][sha512_after] or [wazuh_alert][syscheck][sha512_before] or
         [wazuh_alert][syscheck][sha256_after] or [wazuh_alert][syscheck][sha256_before] or
         [wazuh_alert][syscheck][sha1_after] or [wazuh_alert][syscheck][sha1_before] or
         [wazuh_alert][syscheck][md5_after] or [wazuh_alert][syscheck][md5_before] {
        clone { clones => ["to_opencti_file"] }
      }
    }
  }

  # Jika event adalah untuk OpenCTI
  if "to_opencti" in [tags] {
    mutate {
      add_field => {
        "send_to" => "opencti"
        "action" => "create_indicator"
        "name" => "[Wazuh Alert] %{[wazuh_alert][rule][description]} (Host: %{[wazuh_alert][agent][name]}, IP: %{[wazuh_alert][data][srcip]})"
        "pattern" => "[ipv4-addr:value = '%{[wazuh_alert][data][srcip]}']"
        "pattern_type" => "stix"
        "description" => "Wazuh Alert ID: %{[wazuh_alert][rule][id]}, Level: %{[wazuh_alert][rule][level]}, Full Log: %{[wazuh_alert][full_log]}"
        "observable_type" => "IPv4-Addr"
      }
    }
    # Mapping Wazuh rule.level ke OpenCTI score (misal: Level 10-14 -> Score 80, Level 7-9 -> Score 60)
    ruby {
      code => "
        if event.get('[send_to]') == 'opencti' and event.get('wazuh_alert') and event.get('wazuh_alert')['rule'] and event.get('wazuh_alert')['rule']['level']
          level = event.get('wazuh_alert')['rule']['level'].to_i
          score = 50 # Default score
          if level >= 10
            score = 80
          elsif level >= 7
            score = 60
          end
          event.set('score', score)
        end
      "
    }
    # Hapus tags clone agar tidak diproses oleh output lain
    mutate {
      remove_tag => ["to_opencti", "logstash_alerts"]
    }
  }

  # Jika event adalah untuk GLPI
  if "to_glpi" in [tags] {
    mutate {
      add_field => {
        "send_to" => "glpi"
        "action" => "create_ticket"
        "title" => "[Wazuh Alert] %{[wazuh_alert][rule][description]}"
        "content" => "Wazuh Alert ID: %{[wazuh_alert][rule][id]}, Level: %{[wazuh_alert][rule][level]}, Host: %{[wazuh_alert][agent][name]}, IP: %{[wazuh_alert][data][srcip]}, Full Log: %{[wazuh_alert][full_log]}"
        "source_ip" => "%{[wazuh_alert][data][srcip]}"
        "ticket_type" => "1" # 1 = Incident
      }
    }
    # Mapping Wazuh rule.level ke GLPI urgency (misal: Level 10-14 -> Urgency 4, Level 7-9 -> Urgency 3)
    ruby {
      code => "
        if event.get('[send_to]') == 'glpi' and event.get('wazuh_alert') and event.get('wazuh_alert')['rule'] and event.get('wazuh_alert')['rule']['level']
          level = event.get('wazuh_alert')['rule']['level'].to_i
          urgency = 3 # Default urgency
          if level >= 10
            urgency = 4
          elsif level >= 7
            urgency = 3
          end
          event.set('urgency', urgency)
        end
      "
    }
    # Hapus tags clone agar tidak diproses oleh output lain
    mutate {
      remove_tag => ["to_glpi", "logstash_alerts"]
    }
  }

  # Hash file dari event FIM Wazuh dibuat sebagai observable OpenCTI.
  if "to_opencti_file" in [tags] {
    ruby {
      code => "
        syscheck = event.get('[wazuh_alert][syscheck]') || {}
        candidates = [
          ['SHA-512', syscheck['sha512_after'], 128],
          ['SHA-512', syscheck['sha512_before'], 128],
          ['SHA-256', syscheck['sha256_after'], 64],
          ['SHA-256', syscheck['sha256_before'], 64],
          ['SHA-1', syscheck['sha1_after'], 40],
          ['SHA-1', syscheck['sha1_before'], 40],
          ['MD5', syscheck['md5_after'], 32],
          ['MD5', syscheck['md5_before'], 32]
        ]
        selected = candidates.find do |algorithm, value, length|
          value.is_a?(String) && value.length == length && value.match?(/\\A[0-9a-fA-F]+\\z/)
        end
        if selected
          event.set('hash_algorithm', selected[0])
          event.set('hash_value', selected[1].downcase)
        else
          event.cancel
        end
      "
    }
    mutate {
      add_field => {
        "send_to" => "opencti"
        "action" => "create_indicator"
        "name" => "[Wazuh File Hash] %{[wazuh_alert][rule][description]} - %{hash_algorithm} %{hash_value}"
        "pattern" => "[file:hashes.'%{hash_algorithm}' = '%{hash_value}']"
        "pattern_type" => "stix"
        "description" => "Wazuh file alert: %{[wazuh_alert][full_log]}"
        "observable_type" => "StixFile"
      }
    }
    ruby {
      code => "
        level = event.get('[wazuh_alert][rule][level]').to_i
        score = level >= 10 ? 80 : (level >= 7 ? 60 : 50)
        event.set('score', score)
      "
    }
    mutate {
      remove_tag => ["to_opencti_file", "logstash_alerts"]
    }
  }

  # Contoh aturan kirim balik: indikator OpenCTI skor >= 80 -> buat tiket GLPI
  # (hapus komentar jika ingin dipakai)
  # if [source_system] == "opencti" and [score] and [score] >= 80 {
  #   clone {
  #     clones => ["to_glpi"]
  #   }
  # }
  # if [type] == "to_glpi" {
  #   mutate {
  #     add_field => {
  #       "send_to" => "glpi"
  #       "action"  => "create_ticket"
  #       "title"   => "Indikator berisiko tinggi: %{name}"
  #       "content" => "Pattern: %{pattern} | Skor: %{score}"
  #       "urgency" => "4"
  #     }
  #   }
  # }
}

output {
  # Simpan ke Elasticsearch
  if ![send_to] { # Hanya kirim ke ES jika bukan event untuk OpenCTI/GLPI
    elasticsearch {
      hosts => ["http://IP_ELASTICSEARCH:9200"]
      index => "%{source_system}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
    }
  }

  # Kirim balik ke GLPI lewat Redis (diambil collector)
  if [send_to] == "glpi" {
    redis {
      host => "192.168.1.10"
      port => 6379
      password => "GantiPasswordKuat"
      db => 2
      data_type => "list"
      key => "outbound-glpi"
      codec => "json"
      # Hanya kirim field yang dibutuhkan oleh send_glpi
      data => {
        "action" => "%{action}"
        "title" => "%{title}"
        "content" => "%{content}"
        "source_ip" => "%{source_ip}"
        "urgency" => "%{urgency}"
        "type" => "%{ticket_type}"
      }
    }
  }

  # Kirim balik ke OpenCTI lewat Redis (diambil collector)
  if [send_to] == "opencti" {
    redis {
      host => "192.168.1.10"
      port => 6379
      password => "GantiPasswordKuat"
      db => 2
      data_type => "list"
      key => "outbound-opencti"
      codec => "json"
      # Hanya kirim field yang dibutuhkan oleh send_opencti
      data => {
        "action" => "%{action}"
        "name" => "%{name}"
        "pattern" => "%{pattern}"
        "pattern_type" => "%{pattern_type}"
        "score" => "%{score}"
        "description" => "%{description}"
        "observable_type" => "%{observable_type}"
      }
    }
  }
}
