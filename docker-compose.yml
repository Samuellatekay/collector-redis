services:
  collector:
    build: .
    container_name: opencti-glpi-collector
    restart: always
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASS=${REDIS_PASS}
      - REDIS_DB=2
      - POLL_INTERVAL=60                                # enrichment (dan polling OpenCTI jika stream tidak dipakai)
      - GLPI_POLL_INTERVAL=${GLPI_POLL_INTERVAL:-5}     # BARU: polling tiket GLPI
      - BATCH_SIZE=200
      - OPENCTI_URL=${OPENCTI_URL}
      - OPENCTI_TOKEN=${OPENCTI_TOKEN}
      - OPENCTI_STREAM_ID=${OPENCTI_STREAM_ID:-}        # BARU: kosong = pakai polling
      - GLPI_URL=${GLPI_URL}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN}
      # --- Enrichment ---
      - ABUSEIPDB_KEY=${ABUSEIPDB_KEY:-}
      - VT_API_KEY=${VT_API_KEY:-}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
      - ENRICH_MAX_PER_CYCLE=20
      - ENRICH_DELAY_SECONDS=120
      - ENRICH_CACHE_TTL=86400
      - ENRICH_ASSET=true
    # Jika OpenCTI/GLPI ada di network Docker lain, aktifkan:
    # networks:
    #   - opencti_default
    #   - glpi_default

# networks:
#   opencti_default:
#     external: true
#   glpi_default:
#     external: true