services:
  collector:
    build: .
    container_name: opencti-glpi-collector
    restart: always
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASS=${REDIS_PASS}
      - REDIS_DB=2
      - POLL_INTERVAL=60                                # enrichment
      - OPENCTI_POLL_INTERVAL=1                         # polling jika live stream tidak dipakai
      - GLPI_POLL_INTERVAL=1                            # polling tiket
      - BATCH_SIZE=200
      - OPENCTI_URL=${OPENCTI_URL}
      - OPENCTI_TOKEN=${OPENCTI_TOKEN}
      - OPENCTI_STREAM_ID=${OPENCTI_STREAM_ID:-}        # kosong = pakai polling
      - GLPI_URL=${GLPI_URL}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN}
      # --- Enrichment ---
      - ABUSEIPDB_KEY=${ABUSEIPDB_KEY:-}
      - VT_API_KEY=${VT_API_KEY:-}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
      - ENRICH_MAX_PER_CYCLE=20
      - ENRICH_DELAY_SECONDS=120
      - ENRICH_CACHE_TTL=86400
      - ENRICH_ASSET=true

  flow-viewer:
    build: .
    profiles: ["tools"]
    command: ["python", "-u", "lihat-alur.py", "--full"]
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASS=${REDIS_PASS}
      - REDIS_DB=${REDIS_DB:-2}

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24